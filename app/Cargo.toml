[package]
name = "dgm-nt"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "dgm-nt"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui = "0.37"
spade = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
miniz_oxide = "0.9"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2

[dev-dependencies]
lopdf = "0.47.0"

# Programmicon als Windows-Ressource in die .exe einbetten (siehe build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
